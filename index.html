<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>건강 관리 기록</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      width: 100vw;
    }
    /* iOS Safari 날짜/시간 강제 삐져나옴 완벽 차단 */
    input[type="date"],
    input[type="time"] {
      -webkit-appearance: none !important;
      -moz-appearance: none !important;
      appearance: none !important;
      background: transparent !important;
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
      margin: 0 !important;
      padding: 0 !important;
      max-width: 100% !important;
    }
    input[type="date"]::-webkit-inner-spin-button,
    input[type="date"]::-webkit-calendar-picker-indicator,
    input[type="time"]::-webkit-inner-spin-button,
    input[type="time"]::-webkit-calendar-picker-indicator {
      display: none !important;
      -webkit-appearance: none !important;
    }
    .safe-top { padding-top: env(safe-area-inset-top, 20px); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 20px); }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

  <!-- Main Container -->
  <main class="w-full max-w-sm mx-auto flex-1 flex flex-col px-4 safe-top pb-24 overflow-hidden">
    
    <!-- Header -->
    <header class="flex items-center justify-between mb-3.5 px-1">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-sm shadow-blue-500/30">
          <i class="fa-solid fa-heart-pulse text-sm"></i>
        </div>
        <h1 class="text-lg font-bold tracking-tight text-slate-900" id="page-title">건강 관리 기록</h1>
      </div>
      <span class="text-[11px] font-semibold px-2 py-1 bg-blue-50 text-blue-700 rounded-full" id="header-date">--월 --일</span>
    </header>

    <!-- TAB 1: Record Input -->
    <section id="tab-record" class="space-y-3">
      <!-- Timing & Date Card -->
      <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-[11px] font-bold text-slate-500 flex items-center gap-1.5">
            <i class="fa-regular fa-clock text-blue-500"></i> 시간대 선택
          </span>
          <span class="text-[10px] font-medium text-blue-600" id="timing-auto-badge">자동 선택됨</span>
        </div>

        <!-- 4개 시간대 버튼 -->
        <div class="grid grid-cols-4 gap-1.5">
          <button type="button" class="timing-btn flex flex-col items-center justify-center py-2 rounded-xl border border-slate-200 text-slate-600 transition-all" data-timing="아침">
            <i class="fa-solid fa-sun text-amber-500 text-xs mb-1"></i>
            <span class="text-[11px] font-bold">아침</span>
          </button>
          <button type="button" class="timing-btn flex flex-col items-center justify-center py-2 rounded-xl border border-slate-200 text-slate-600 transition-all" data-timing="점심">
            <i class="fa-solid fa-cloud-sun text-orange-400 text-xs mb-1"></i>
            <span class="text-[11px] font-bold">점심</span>
          </button>
          <button type="button" class="timing-btn flex flex-col items-center justify-center py-2 rounded-xl border border-slate-200 text-slate-600 transition-all" data-timing="저녁">
            <i class="fa-solid fa-utensils text-rose-500 text-xs mb-1"></i>
            <span class="text-[11px] font-bold">저녁</span>
          </button>
          <button type="button" class="timing-btn flex flex-col items-center justify-center py-2 rounded-xl border border-slate-200 text-slate-600 transition-all" data-timing="취침전">
            <i class="fa-solid fa-moon text-indigo-500 text-xs mb-1"></i>
            <span class="text-[11px] font-bold">취침전</span>
          </button>
        </div>

        <!-- 아이폰 미니 완벽 고정 터치 박스 -->
        <div class="grid grid-cols-2 gap-2 pt-1">
          <!-- 날짜 선택 박스 -->
          <div class="relative bg-slate-50 rounded-xl border border-slate-200 p-2 text-center overflow-hidden">
            <span class="text-[10px] text-slate-400 font-semibold block">측정 날짜</span>
            <span id="date-display" class="text-xs font-bold text-slate-800">2026. 10. 28.</span>
            <input type="date" id="input-date" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
          </div>
          <!-- 시간 선택 박스 -->
          <div class="relative bg-slate-50 rounded-xl border border-slate-200 p-2 text-center overflow-hidden">
            <span class="text-[10px] text-slate-400 font-semibold block">측정 시간</span>
            <span id="time-display" class="text-xs font-bold text-slate-800">오전 08:00</span>
            <input type="time" id="input-time" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
          </div>
        </div>
      </div>

      <!-- Blood Pressure Card -->
      <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm space-y-2.5">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-1.5 text-xs font-bold text-slate-700">
            <span class="w-2 h-2 rounded-full bg-rose-500"></span> 혈압 및 맥박
          </div>
          <span class="text-[10px] text-slate-400">정상: 120 / 80 mmHg</span>
        </div>
        <div class="grid grid-cols-3 gap-1.5">
          <div class="bg-slate-50 p-2 rounded-xl border border-slate-200 text-center">
            <span class="text-[9px] text-slate-400 font-semibold block mb-0.5">수축기 (최고)</span>
            <input type="number" id="bp-sys" placeholder="120" inputmode="numeric" class="w-full text-center text-base font-bold text-slate-900 bg-transparent focus:outline-none">
            <span class="text-[8px] text-slate-400">mmHg</span>
          </div>
          <div class="bg-slate-50 p-2 rounded-xl border border-slate-200 text-center">
            <span class="text-[9px] text-slate-400 font-semibold block mb-0.5">이완기 (최저)</span>
            <input type="number" id="bp-dia" placeholder="80" inputmode="numeric" class="w-full text-center text-base font-bold text-slate-900 bg-transparent focus:outline-none">
            <span class="text-[8px] text-slate-400">mmHg</span>
          </div>
          <div class="bg-slate-50 p-2 rounded-xl border border-slate-200 text-center">
            <span class="text-[9px] text-slate-400 font-semibold block mb-0.5">맥박수</span>
            <input type="number" id="pulse" placeholder="72" inputmode="numeric" class="w-full text-center text-base font-bold text-slate-900 bg-transparent focus:outline-none">
            <span class="text-[8px] text-slate-400">bpm</span>
          </div>
        </div>
      </div>

      <!-- Blood Glucose Card -->
      <div class="bg-white p-3.5 rounded-2xl border
