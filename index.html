<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>건강 관리 기록</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    input[type="date"]::-webkit-inner-spin-button,
    input[type="time"]::-webkit-inner-spin-button { display: none; }
    .safe-top { padding-top: env(safe-area-inset-top, 20px); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 20px); }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col justify-between overflow-x-hidden">

  <!-- Main Container -->
  <main class="w-full max-w-md mx-auto flex-1 flex flex-col p-4 safe-top pb-24 overflow-x-hidden">
    
    <!-- Header -->
    <header class="flex items-center justify-between mb-4 px-1">
      <div class="flex items-center space-x-2.5">
        <div class="w-9 h-9 rounded-2xl bg-blue-600 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
          <i class="fa-solid fa-heart-pulse text-base"></i>
        </div>
        <h1 class="text-xl font-bold tracking-tight text-slate-900" id="page-title">건강 관리 기록</h1>
      </div>
      <span class="text-xs font-semibold px-2.5 py-1.5 bg-blue-50 text-blue-700 rounded-full" id="header-date">--월 --일</span>
    </header>

    <!-- TAB 1: Record Input -->
    <section id="tab-record" class="space-y-3.5">
      <!-- Timing & Date Card -->
      <div class="bg-white p-4 rounded-3xl border border-slate-200/80 shadow-sm space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-slate-500 flex items-center gap-1.5">
            <i class="fa-regular fa-clock text-blue-500"></i> 시간대 선택
          </span>
          <span class="text-[11px] font-medium text-blue-600" id="timing-auto-badge">자동 선택됨</span>
        </div>

        <!-- 아침/점심/저녁/취침전 버튼 -->
        <div class="grid grid-cols-4 gap-1.5">
          <button type="button" class="timing-btn flex flex-col items-center justify-center py-2.5 rounded-2xl border border-slate-200 text-slate-600 transition-all" data-timing="아침">
            <i class="fa-solid fa-sun text-amber-500 text-sm mb-1"></i>
            <span class="text-xs font-bold">아침</span>
          </button>
          <button type="button" class="timing-btn flex flex-col items-center justify-center py-2.5 rounded-2xl border border-slate-200 text-slate-600 transition-all" data-timing="점심">
            <i class="fa-solid fa-cloud-sun text-orange-400 text-sm mb-1"></i>
            <span class="text-xs font-bold">점심</span>
          </button>
          <button type="button" class="timing-btn flex flex-col items-center justify-center py-2.5 rounded-2xl border border-slate-200 text-slate-600 transition-all" data-timing="저녁">
            <i class="fa-solid fa-utensils text-rose-500 text-sm mb-1"></i>
            <span class="text-xs font-bold">저녁</span>
          </button>
          <button type="button" class="timing-btn flex flex-col items-center justify-center py-2.5 rounded-2xl border border-slate-200 text-slate-600 transition-all" data-timing="취침전">
            <i class="fa-solid fa-moon text-indigo-500 text-sm mb-1"></i>
            <span class="text-xs font-bold">취침전</span>
          </button>
        </div>

        <!-- 아이폰 12 미니 최적화: 날짜/시간 상하 2줄 분리 (밀림 100% 방지) -->
        <div class="space-y-2 pt-1">
          <div class="flex items-center justify-between px-3 py-2.5 bg-slate-50 rounded-xl border border
